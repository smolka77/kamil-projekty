<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fasolka – Lobby</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#5fb0ff; }
  canvas { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
</style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
// Samodzielne demo lobby z prostą fasolką. W grze (bean-fps) lobby używa modelu gracza z twarzą ze zdjęcia.
import * as THREE from 'three';
import { createLobby } from './lobby.js';

// Gra otwierana przyciskiem GRAJ (artefakt z grą bean-fps, już z tym lobby na starcie).
const GAME_URL = 'https://claude.ai/artifact/77HjtkSu2VLX1aV4xD6A1B';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));

// prosta fasolka (przodem do -Z, ~1,5 m)
const skin = new THREE.MeshStandardMaterial({ color: 0xf0b440, roughness: .55 });
const bean = new THREE.Group();
const body = new THREE.Group(); bean.add(body);
const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.36, .52, 12, 32), skin);
torso.position.y = .78; body.add(torso);
const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .3 });
const black = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: .3 });
const eyes = [-.09, .09].map(x => {
  const e = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), white);
  e.scale.set(.06, .08, .035); e.position.set(x, 1.08, -.34);
  const p = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), black);
  p.scale.set(.5, .55, .5); p.position.set(0, -.05, -.8); e.add(p);
  body.add(e); return e;
});
const arms = [-1, 1].map(side => {
  const pivot = new THREE.Group(); pivot.position.set(.36 * side, .98, 0);
  const a = new THREE.Mesh(new THREE.CapsuleGeometry(.06, .34, 8, 16), skin); a.position.y = -.22; pivot.add(a);
  body.add(pivot); return pivot;
});
[-.14, .14].forEach(x => {
  const l = new THREE.Mesh(new THREE.CapsuleGeometry(.075, .2, 8, 16), skin); l.position.set(x, .17, 0); bean.add(l);
});

let blinkAt = 2;
function animate(b, t, dt, st) {
  const br = Math.sin(t * 2.1);
  body.scale.set(1 + br * .015, 1 - br * .02, 1 + br * .015);
  body.rotation.z = Math.sin(t * 1.1) * .03;
  arms[0].rotation.z = -.12 - br * .03;                                   // ręka po stronie -X luźno
  arms[1].rotation.z = THREE.MathUtils.lerp(.12 + br * .03, 2.6 + Math.sin(t * 13) * .35, st.wave);   // macha nad GRAJ
  if (t > blinkAt) {
    const k = (t - blinkAt) / .15, sy = k < 1 ? .08 * Math.abs(1 - 2 * k) + .01 : .08;
    eyes.forEach(e => e.scale.y = sy);
    if (k >= 1) blinkAt = t + 2 + Math.random() * 3;
  }
}

const lobby = createLobby({
  renderer, bean, animate,
  onPlay: () => { lobby.hide(); location.href = GAME_URL; },   // wybrany tryb wybiera się ponownie w lobby gry
});

const clock = new THREE.Clock();
(function loop() {
  lobby.update(Math.min(clock.getDelta(), .05));
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
