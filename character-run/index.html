<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Run</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#20232a;font-family:system-ui,sans-serif;color:#eee}
  canvas{display:block}
  #hud{position:fixed;left:12px;top:12px;background:#0008;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.5;pointer-events:none}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:#20232a;z-index:5}
</style>
</head>
<body>
<div id="msg">Ładowanie modelu (24 MB)…</div>
<div id="hud">WASD – ruch · Shift – bieg · Spacja – skok<br>Przeciągnij myszką – kamera · kółko – zoom · R – reset</div>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb4d6);
scene.fog = new THREE.Fog(0x8fb4d6, 30, 120);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(8,14,6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:50});
scene.add(sun, sun.target);

// podłoże + kilka obiektów do biegania
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400,400), new THREE.MeshStandardMaterial({color:0x6c8a5a,roughness:1}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(400,200,0x000000,0x000000); grid.material.opacity=.12; grid.material.transparent=true; grid.position.y=0.01; scene.add(grid);
const obstacles = [];
for (let i=0;i<14;i++){
  const s = 0.8+Math.random()*2.2;
  const m = new THREE.Mesh(new THREE.BoxGeometry(s,s,s), new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(Math.random(),.45,.55)}));
  const a = Math.random()*Math.PI*2, r = 6+Math.random()*22;
  m.position.set(Math.cos(a)*r, s/2, Math.sin(a)*r); m.rotation.y=Math.random()*3;
  m.castShadow = m.receiveShadow = true; scene.add(m); obstacles.push(m);
}

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 400);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ---- tekstury ----
const tl = new THREE.TextureLoader();
const loadTex = (f,srgb)=>new Promise(r=>tl.load('./assets/textures/'+f,t=>{t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;r(t)},undefined,()=>r(null)));
const T = {
  Body:[await loadTex('T_RubySnapper_Body_CL.png',1), await loadTex('T_RubySnapper_Body_N.png',0)],
  Head:[await loadTex('T_RubySnapper_Head_CL.png',1), await loadTex('T_RubySnapper_Head_N.png',0)],
  FaceAcc:[await loadTex('T_RubySnapper_FaceAcc_CL.png',1), await loadTex('T_RubySnapper_FaceAcc_N.png',0)],
};

// ---- model ----
const fbx = await new Promise((res,rej)=>new FBXLoader().load('./assets/model.fbx',res,undefined,rej));
// FBX przemyca własne światło i kamerę (Light:PointLight) – prześwietlały całą scenę
for (const c of [...fbx.children]) if (c.isLight || c.isCamera) fbx.remove(c);
const HIDE = new Set(['HG_TeethUpper002','HG_TeethUpper003']); // skala świata 10000 (100x za duże) – patrz notatka
fbx.traverse(o=>{
  if(HIDE.has(o.name)){ o.visible=false; return; }
  if(!(o.isMesh||o.isSkinnedMesh)) return;
  o.frustumCulled=false; o.castShadow=true;
  const fix = m=>{
    const key = /FaceAcc/i.test(m.name)?'FaceAcc':/Body/i.test(m.name)?'Body':/Head/i.test(m.name)?'Head':null;
    if(/Outline/i.test(m.name)){ m.visible=false; return m; }   // outline shell z Fortnite – tu zasłaniał kolory
    if(!key){ m.color.set(0xf2ece4); return m; }                // zęby/usta bez tekstur
    const n = new THREE.MeshStandardMaterial({map:T[key][0],normalMap:T[key][1],roughness:.75,metalness:0,side:THREE.DoubleSide,name:m.name});
    if(key==='FaceAcc') n.transparent=true;
    return n;
  };
  o.material = Array.isArray(o.material)?o.material.map(fix):fix(o.material);
});

window.__dbg=[];
fbx.traverse(o=>{ if(o.isMesh) (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>window.__dbg.push([o.name,m.name,m.type,!!m.map,m.map&&m.map.image?m.map.image.width:0,!!m.normalMap,o.visible])); });
const player = new THREE.Group();
fbx.scale.setScalar(0.01);           // cm -> m
player.add(fbx);
scene.add(player);
fbx.updateMatrixWorld(true);

// ---- proceduralna animacja na kościach ----
const bones = {};
fbx.traverse(o=>{ if(o.isBone && !(o.name in bones)) bones[o.name]=o; });
const get = (...names)=>{ for(const n of names) if(bones[n]) return bones[n]; return null; };
const B = {
  pelvis:get('pelvis'), spine2:get('spine_02'), spine3:get('spine_03'), head:get('head'),
  thighL:get('thigh_l'), thighR:get('thigh_r'), calfL:get('calf_l'), calfR:get('calf_r'),
  uaL:get('upperarm_l'), uaR:get('upperarm_r'), laL:get('lowerarm_l'), laR:get('lowerarm_r'),
};
window.__bones = Object.fromEntries(Object.entries(B).map(([k,v])=>[k,!!v]));
const rest = new Map();   // rest local quaternion
fbx.traverse(o=>{ if(o.isBone) rest.set(o,o.quaternion.clone()); });
const restRoot = new Map(); // rest quaternion in model-root space
const chainQ = (b,src)=>{ const q=new THREE.Quaternion(); for(let o=b;o&&o!==fbx;o=o.parent) q.premultiply(src(o)); return q; };
for(const b of Object.values(B)) if(b) restRoot.set(b, chainQ(b,o=>rest.get(o)||o.quaternion));
const restPos = B.pelvis ? B.pelvis.position.clone() : null;
// strona kości (l/r) wg pozycji x w przestrzeni modelu
const p0 = new THREE.Vector3();
const sideSign = b=>{ if(!b) return 1; b.getWorldPosition(p0); fbx.worldToLocal(p0); return Math.sign(p0.x)||1; };

const AX = {x:new THREE.Vector3(1,0,0), z:new THREE.Vector3(0,0,1), y:new THREE.Vector3(0,1,0)};
const qa = new THREE.Quaternion();
// ustaw kość tak, aby jej orientacja = R(os,kąt) * pozycja spoczynkowa (w przestrzeni modelu)
function pose(b, axis, ang, ang2=0, axis2='x'){
  if(!b) return;
  qa.setFromAxisAngle(AX[axis],ang);
  if(ang2){ const q2=new THREE.Quaternion().setFromAxisAngle(AX[axis2],ang2); qa.multiply(q2); }
  const parentQ = chainQ(b.parent, o=>o.quaternion);
  const target = qa.clone().multiply(restRoot.get(b));
  b.quaternion.copy(parentQ.invert().multiply(target));
}
function resetBones(){ for(const [b,q] of rest) b.quaternion.copy(q); }

let phase = 0, lean = 0;
function animate(dt, speedNorm, airborne){
  // kolejność ma znaczenie: rodzice przed dziećmi
  const s = speedNorm;                       // 0..1 (1 = bieg)
  phase += dt*(6 + s*8)*(s>0.02?1:0);
  const sw = Math.sin(phase), sw2 = Math.sin(phase+Math.PI);
  const amp = airborne ? 0.35 : 0.2+0.75*s;
  const sgn = k=>sideSign(B[k]);
  resetBones();
  if(B.pelvis && restPos){ B.pelvis.position.y = restPos.y - Math.abs(Math.cos(phase))*0.025*s*100/100; }
  // tułów: lekki pochył i skręt
  pose(B.spine2,'x',-lean*0.5, 0);
  // nogi (zginanie do przodu = obrót wokół X w ujemną stronę, bo postać patrzy +Z)
  const legL = airborne? -0.9 : -sw*amp*0.9, legR = airborne? 0.4 : -sw2*amp*0.9;
  pose(B.thighL,'x',legL); pose(B.thighR,'x',legR);
  pose(B.calfL,'x', airborne? 1.2 : Math.max(0,sw)*amp*1.3);
  pose(B.calfR,'x', airborne? 0.6 : Math.max(0,sw2)*amp*1.3);
  // ręce: z A-pose w dół + wymach w przeciwfazie do nóg
  const down = 0.95;                        // opuszczenie ramion
  const armSw = airborne? 0 : amp*0.8;
  pose(B.uaL,'z',-sgn('uaL')*down, -sw2*armSw, 'x');
  pose(B.uaR,'z',-sgn('uaR')*down, -sw*armSw, 'x');
  pose(B.laL,'x',-(0.25+0.9*s)*(airborne?1.2:1));
  pose(B.laR,'x',-(0.25+0.9*s)*(airborne?1.2:1));
  pose(B.head,'x', lean*0.3);
}

// ---- sterowanie ----
const keys = {};
addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='Space') e.preventDefault(); if(e.code==='KeyR'){player.position.set(0,0,0);vel.set(0,0,0);} });
addEventListener('keyup',e=>keys[e.code]=false);
let camYaw = Math.PI, camPitch = 0.25, camDist = 4.2, drag=false;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('pointermove',e=>{ if(!drag) return; camYaw-=e.movementX*0.006; camPitch=THREE.MathUtils.clamp(camPitch+e.movementY*0.005,-0.2,1.3); });
renderer.domElement.addEventListener('wheel',e=>{ camDist=THREE.MathUtils.clamp(camDist+e.deltaY*0.003,1.5,12); },{passive:true});

const vel = new THREE.Vector3();
let facing = 0, onGround = true, speedSm = 0;
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), wish = new THREE.Vector3();
const clock = new THREE.Clock();

function step(dt){
  // kierunki względem kamery
  fwd.set(-Math.sin(camYaw),0,-Math.cos(camYaw));
  right.crossVectors(fwd,new THREE.Vector3(0,1,0));
  wish.set(0,0,0);
  if(keys.KeyW||keys.ArrowUp) wish.add(fwd);
  if(keys.KeyS||keys.ArrowDown) wish.sub(fwd);
  if(keys.KeyD||keys.ArrowRight) wish.add(right);
  if(keys.KeyA||keys.ArrowLeft) wish.sub(right);
  const moving = wish.lengthSq()>0;
  const run = keys.ShiftLeft||keys.ShiftRight;
  const maxSpeed = run?7:2.6;
  if(moving){
    wish.normalize();
    vel.x = THREE.MathUtils.damp(vel.x, wish.x*maxSpeed, 10, dt);
    vel.z = THREE.MathUtils.damp(vel.z, wish.z*maxSpeed, 10, dt);
    const target = Math.atan2(wish.x,wish.z);
    let d = target-facing; d = Math.atan2(Math.sin(d),Math.cos(d));
    facing += d*Math.min(1,dt*12);
  } else {
    vel.x = THREE.MathUtils.damp(vel.x,0,12,dt); vel.z = THREE.MathUtils.damp(vel.z,0,12,dt);
  }
  if(onGround && keys.Space){ vel.y=6.2; onGround=false; }
  vel.y -= 18*dt;
  player.position.addScaledVector(vel,dt);
  if(player.position.y<=0){ player.position.y=0; vel.y=0; onGround=true; }
  // proste kolizje z pudłami (okrąg vs. okrąg)
  for(const o of obstacles){
    const r = o.geometry.parameters.width*0.5*1.35 + 0.3;
    const dx=player.position.x-o.position.x, dz=player.position.z-o.position.z, dist=Math.hypot(dx,dz);
    const top=o.geometry.parameters.height;
    if(dist<r && player.position.y<top-0.05){ player.position.x=o.position.x+dx/dist*r; player.position.z=o.position.z+dz/dist*r; }
    else if(dist<r*0.8 && player.position.y>=top-0.05 && vel.y<=0){ player.position.y=top; vel.y=0; onGround=true; }
  }
  player.rotation.y = facing;
  const hs = Math.hypot(vel.x,vel.z);
  speedSm = THREE.MathUtils.damp(speedSm, Math.min(1,hs/7), 12, dt);
  lean = THREE.MathUtils.damp(lean, Math.min(1,hs/7)*0.25, 8, dt);
  animate(dt, speedSm, !onGround);
  window.__state = {x:player.position.x,y:player.position.y,z:player.position.z,speed:hs};
}

function frame(){
  const dt = Math.min(clock.getDelta(),0.05);
  step(dt);
  const tgt = new THREE.Vector3(player.position.x, player.position.y+1.35, player.position.z);
  camera.position.set(tgt.x+Math.sin(camYaw)*Math.cos(camPitch)*camDist, tgt.y+Math.sin(camPitch)*camDist, tgt.z+Math.cos(camYaw)*Math.cos(camPitch)*camDist);
  camera.lookAt(tgt);
  sun.position.set(player.position.x+8,14,player.position.z+6); sun.target.position.copy(player.position);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
document.getElementById('msg').remove();
window.__ready = true;
frame();
</script>
</body>
</html>
